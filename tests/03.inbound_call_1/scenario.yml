---
timeout: 40

init_tasks:
  - name: Add DID mapping
    type: mysql-client
    script: scripts/add_did_mapping.sh
    args: {{ callee_did }}

  - name: Reload dialplan
    type: opensips-mi
    args: dp_reload
    require:
      - after:
          task: Add DID mapping
tasks:
  - name: OpenSIPS Core Server
    type: opensips
    config_file: scripts/opensips-error.cfg
    args: -p /etc/opensips/scripts/substenv.sh
    ip: {{ core_ip }}
    network: core

  - name: OpenSIPS Failover Server
    type: opensips
    config_file: scripts/opensips-core.cfg
    args: -p /etc/opensips/scripts/substenv.sh
    ip: {{ failover_ip }}
    network: core

  - name: Register callee
    type: uac-sipp
    username: {{ callee }}
    password: "{{ callee_password }}"
    config_file: scripts/sipp-register.xml
    ip: {{ callee_ip }}
    port: {{ callee_port }}
    require:
      - after:
          task: OpenSIPS Core Server
      - after:
          task: OpenSIPS Failover Server
    network: exterior

  - name: Gateway UAC
    type: uac-sipp
    config_file: scripts/gateway.xml
    ip: {{ gateway_ip }}
    keys:
      callee_did: 1234567890
    network: pstn
    require:
      - after:
          task: Register callee

  - name: Callee UAC
    type: uas-sipp
    username: {{ callee }}
    password: "{{ callee_password }}"
    config_file: scripts/callee.xml
    ip: {{ callee_ip }}
    port: {{ callee_port }}
    require:
      - after:
          task: Register callee
      - started:
          task: Gateway UAC
    network: exterior

cleanup_tasks:
  - name: Remove DID mapping
    type: mysql-client
    script: scripts/delete_did_mapping.sh
    args: {{ callee_did }}

  - name: Reload dialplan
    type: opensips-mi
    args: dp_reload
    require:
      - after:
          task: Remove DID mapping
