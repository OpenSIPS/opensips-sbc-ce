---
timeout: 20

tasks:
  - name: OpenSIPS Core Server
    type: opensips
    config_file: scripts/opensips-error.cfg
    args: -p /etc/opensips/scripts/substenv.sh
    ip: {{ core_ip }}
    network: core

  - name: OpenSIPS Failover Server
    type: opensips
    config_file: scripts/opensips-core.cfg
    args: -p /etc/opensips/scripts/substenv.sh
    ip: {{ failover_ip }}
    network: core

  - name: Register caller
    type: uac-sipp
    username: {{ caller }}
    password: "{{ caller_password }}"
    config_file: scripts/sipp-register.xml
    ip: {{ caller_ip }}
    port: {{ caller_port }}
    require:
      - after:
          task: OpenSIPS Core Server
      - after:
          task: OpenSIPS Failover Server
    network: exterior

  - name: Caller UAC
    type: uac-sipp
    config_file: scripts/caller.xml
    username: {{ caller }}
    password: "{{ caller_password }}"
    ip: {{ caller_ip }}
    port: {{ caller_port }}
    keys:
      did: {{ outgoing_did }}
    require:
      - after:
          task: Register caller
    network: exterior

  - name: Gateway UAS
    type: uas-sipp
    config_file: scripts/gateway.xml
    ip: {{ gateway_ip }}
    require:
      - started:
          task: Caller UAC
    network: pstn
