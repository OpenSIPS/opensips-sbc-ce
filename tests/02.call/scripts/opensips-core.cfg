debug_mode=no

log_level=6

stderror_enabled=yes
syslog_enabled=no

syslog_facility=LOG_LOCAL2

sip_warning=0

check_via=no	# (cmd. line: -v)
dns=no           # (cmd. line: -r)
rev_dns=no      # (cmd. line: -R)
disable_dns_blacklist=yes
disable_dns_failover=yes
auto_aliases=no
udp_workers = 8

socket=udp:127.0.0.1:5080

# ------------------ module loading ----------------------------------

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"

loadmodule "sl.so"

loadmodule "signaling.so"

loadmodule "maxfwd.so"

loadmodule "textops.so"

loadmodule "sipmsgops.so"

loadmodule "options.so"

loadmodule "rr.so"

loadmodule "tm.so"
modparam("tm", "fr_timeout", 2)
modparam("tm", "fr_inv_timeout", 70)
modparam("tm", "wt_timer", 20)
modparam("tm", "syn_branch", 0)
modparam("tm", "pass_provisional_replies", 1)
modparam("tm", "onreply_avp_mode", 1)

loadmodule "usrloc.so"

loadmodule "registrar.so"
modparam("registrar", "min_expires", 0)
modparam("registrar", "max_expires", 30)
modparam("registrar", "default_expires", 30)

loadmodule "dialog.so"
loadmodule "auth.so"

loadmodule "topology_hiding.so"
modparam("topology_hiding", "th_callid_prefix", "THCALL_")

loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo_core")
modparam("mi_fifo", "fifo_mode", 0666)

# main routing logic
route {
	xlog("[$ci] $rm/$ru received from $si:$sp\n");
	if (is_method("REGISTER")) {
		save("location");
		exit;
	} else if (is_method("OPTIONS")) {
		send_reply(200, "OK");
		exit;
	} else if (is_method("INVITE") && !has_totag()) {
		if (!lookup("location")) {
			xlog("[$ci] $ru not registered\n");
			send_reply(404, "Not Found");
			exit;
		}
		if ($hdr(Proxy-Authorization) == NULL)
			proxy_challenge("");
		record_route();
		create_dialog();
		topology_hiding("C");
		t_on_reply("reply");
		append_hf("X-Call-Id: $ci\r\n");
	} else {
		loose_route();
		topology_hiding_match();
	}
	t_relay();
}

onreply_route[reply] {
	subst_body("/101/127/g");
}
