---
init_tasks:
  - name: Add test core server
    type: mysql-client
    script: init_tasks/add_core_server.sh
    args:
      - sip:{{ core_ip }}:{{ core_port }}
      - {{ default_domain }}

  - name: Add failover server
    type: mysql-client
    script: init_tasks/add_core_server.sh
    args:
      - sip:{{ failover_ip }}:{{ failover_port }}
      - {{ default_domain }}

  - name: Add DID mapping
    type: mysql-client
    script: init_tasks/add_did_mapping.sh
    args:
      - {{ callee_did }}
    require:
      after:
        task: Add test core server
      after:
        task: Add failover server

  - name: Reload dispatcher
    type: opensips-mi
    args: ds_reload
    require:
      after:
        task: Add test core server
      after:
        task: Add failover server

  - name: Reload dialplan
    type: opensips-mi
    args: dp_reload
    require:
      after:
        task: Add DID mapping

  - name: Add gateway
    type: mysql-client
    script: init_tasks/add_gateway.sh
    args:
      - gw-domain-test
      - sip:{{ gateway_ip }}:{{ gateway_port }}
      - 'Gateway Test 1'

  - name: Reload dynamic routing
    type: opensips-mi
    args: dr_reload
    require:
      after:
        task: Add gateway

cleanup_tasks:
  - name: Remove test core server
    type: mysql-client
    script: cleanup_tasks/delete_core_server.sh
    args:
      - sip:{{ core_ip }}:{{ core_port }}
      - {{ default_domain }}

  - name: Remove failover server
    type: mysql-client
    script: cleanup_tasks/delete_core_server.sh
    args:
      - sip:{{ failover_ip }}:{{ failover_port }}
      - {{ default_domain }}

  - name: Remove DID mapping
    type: mysql-client
    script: cleanup_tasks/delete_did_mapping.sh
    args:
      - {{ callee_did }}

  - name: Reload dispatcher
    type: opensips-mi
    args: ds_reload
    require:
      after:
        task: Remove test core server

  - name: Reload dialplan
    type: opensips-mi
    args: dp_reload
    require:
      after:
        task: Remove test core server

  - name: Remove gateway
    type: mysql-client
    script: cleanup_tasks/delete_gateway.sh
    args: 'sip:{{ gateway_ip }}:{{ gateway_port }}'

  - name: Reload dynamic routing
    type: opensips-mi
    args: dr_reload
    require:
      after:
        task: Remove gateway

defaults:
  opensips:
    image: opensips/opensips:cp-all-tools
    env:
      CORE_IP: {{ core_ip }}
      CORE_PORT: {{ core_port }}
      FAILOVER_IP: {{ failover_ip }}
      FAILOVER_PORT: {{ failover_port }}
      DOMAIN: {{ default_domain }}
      CALLER: {{ caller }}
      CALLEE: {{ callee }}
      CALLEE_DID: {{ callee_did }}
      CALLER_PASSWORD: "{{ caller_password }}"
      CALLEE_PASSWORD: "{{ callee_password }}"
  opensips-cli:
    mi_ip: {{ opensips_ip }}
    options:
      database_user_url: mysql://{{ mysql_user }}:{{ mysql_password }}@{{ opensips_ip }}/{{ database }}
  opensips-mi:
    mi_ip: {{ mi_ip }}
    env:
      CONN: http
      URL: http://{{ mi_ip }}:8888/mi
  uac-sipp:
    proxy: {{ opensips_ip }}:{{ opensips_port }}
    keys:
      domain: {{ default_domain }}
      caller: {{ caller }}
      callee: {{ callee }}
      run_id: "{{ run_id }}"
  mysql-client:
    host: {{ mysql_ip }}
    user: {{ mysql_user }}
    password: {{ mysql_password }}
    database: {{ database }}

bridge_networks:
  - name: core
    subnet: {{ core_network }}
    gateway: {{ core_network_gw }}

  - name: exterior
    subnet: {{ users_network }}
    gateway: {{ users_network_gw }}

  - name: pstn
    subnet: {{ pstn_network }}
    gateway: {{ pstn_network_gw }}
