services:
  mysql:
    build:
      dockerfile_inline: |
        FROM mysql:latest
        # get the latest/newest opensips-mysql-dbschema package
        RUN echo  "https://yum.opensips.org/3.6/nightly/el/9/x86_64/$(curl -s -L https://yum.opensips.org/3.6/nightly/el/9/x86_64 | grep -oE "opensips-mysql-dbschema[^r]*.rpm" | tail -1)" | xargs rpm -i
    container_name: mysql
    volumes:
      - ./etc/mysql:/docker-entrypoint-initdb.d
      - db:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_IP=localhost
    healthcheck:
      test: mysql -u ${MYSQL_USER} -p'${MYSQL_PASSWORD}' opensips -e 'SHOW TABLES LIKE "location"' 2>&1 | grep -q location
      interval: 10s
      timeout: 1s
      retries: 5
      start_period: 20s
    networks:
      localnetwork:
        ipv4_address: ${MYSQL_IP}

  opensips:
    image: opensips/opensips:cp-all-tools
    container_name: opensips
    volumes:
      - ./etc/opensips:/etc/opensips
    ports:
      - 5060:5060/udp
      - 5060:5060/tcp
    expose:
      - 9060/tcp
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -p /etc/opensips/substenv.sh
    networks:
      localnetwork:
        ipv4_address: ${OPENSIPS_IP}

  opensips-cp:
    build:
      context: ./etc/opensips-cp/image
      dockerfile_inline: FROM opensips/opensips-cp:latest
    container_name: opensips-cp
    env_file:
      - .env
    ports:
      - 80:80
    expose:
      - 9060/tcp
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./etc/opensips-cp/docker-entrypoint.d:/docker-entrypoint.d
      - type: bind
        source: ./etc/mysql/functions
        target: /docker-entrypoint.d/functions
    networks:
      localnetwork:
        ipv4_address: ${CP_IP}

  rtpengine:
      image: fonoster/rtpengine:latest
      container_name: rtpengine
      environment:
        RTPENGINE_PUBLIC_IP: ${HOST_IP}
        RTPENGINE_PORT_MIN: ${MINPORT}
        RTPENGINE_PORT_MAX: ${MAXPORT}
        RTPENGINE_BIND_NG_PORT: ${RTPENGINE_PORT}
        RTPENGINE_BIND_NG_IP: ${RTPENGINE_IP}
        RTPENGINE_LOG_LEVEL: ${RTPENGINE_LOG_LEVEL}
      networks:
        localnetwork:
          ipv4_address: ${RTPENGINE_IP}

volumes:
  db:

networks:
  localnetwork:
    name: sbc-br
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "${HOST_IP}"
      com.docker.network.bridge.name: sbc-br
    ipam:
      config:
        - subnet: ${NETWORK}
