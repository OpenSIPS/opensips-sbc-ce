services:
  mysql:
    build:
      dockerfile_inline: |
        FROM mysql:latest
        # get the latest/newest opensips-mysql-dbschema package
        RUN echo  "https://yum.opensips.org/3.6/nightly/el/9/x86_64/$(curl -s -L https://yum.opensips.org/3.6/nightly/el/9/x86_64 | grep -oE "opensips-mysql-dbschema[^r]*.rpm" | tail -1)" | xargs rpm -i
    container_name: mysql
    volumes:
      - ./etc/mysql:/docker-entrypoint-initdb.d
      - db:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_IP=localhost
    healthcheck:
      test: mysql -h ${MYSQL_IP} -P ${MYSQL_PORT} -u ${MYSQL_USER} -p'${MYSQL_PASSWORD}' opensips -e 'SHOW TABLES LIKE "location"' 2>&1 | grep -q location
      interval: 10s
      timeout: 1s
      retries: 5
      start_period: 20s
    network_mode: host

  opensips:
    image: opensips/opensips:cp-all-tools
    container_name: opensips
    volumes:
      - ./etc/opensips:/etc/opensips
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -p /etc/opensips/substenv.sh
    network_mode: host

  opensips-cp:
    build:
      context: ./etc/opensips-cp/image
      dockerfile_inline: FROM opensips/opensips-cp:latest
    container_name: opensips-cp
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./etc/opensips-cp/docker-entrypoint.d:/docker-entrypoint.d
      - type: bind
        source: ./etc/mysql/functions
        target: /docker-entrypoint.d/functions
    network_mode: host

  rtpengine:
      image: fonoster/rtpengine:latest
      container_name: rtpengine
      environment:
        RTPENGINE_PUBLIC_IP: ${HOST_IP}
        RTPENGINE_PORT_MIN: ${MINPORT}
        RTPENGINE_PORT_MAX: ${MAXPORT}
        RTPENGINE_BIND_NG_PORT: ${RTPENGINE_PORT}
        RTPENGINE_BIND_NG_IP: 0.0.0.0
        RTPENGINE_LOG_LEVEL: ${RTPENGINE_LOG_LEVEL}
      network_mode: host

volumes:
  db:
